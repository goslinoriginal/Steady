<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E7656">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Steady">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.45 system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Steady Spending</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone-first app, a single "safe to spend today" number up top, bottom tab bar, bottom sheets for every action. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#F4F7F5; --ink:#13201A; --muted:#5A6962; --line:#D7E0DA;
  --accent:#1E7656; --accent-ink:#FFFFFF; --accent-soft:#DCEEE5;
  --want:#6F47C9; --want-soft:#ECE5FA;
  --warn:#A76500; --warn-soft:#FAEED6; --bad:#BC3B27; --bad-soft:#FAE2DC;
  --shadow:0 1px 2px rgba(19,32,26,.06),0 8px 24px rgba(19,32,26,.06);
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1311; --surface:#151D1A; --surface-2:#1B2521; --ink:#E4EDE8; --muted:#92A29B; --line:#29352F;
  --accent:#4CC497; --accent-ink:#052419; --accent-soft:#173829;
  --want:#A98BF3; --want-soft:#272040;
  --warn:#E6A33C; --warn-soft:#382A12; --bad:#EF7A65; --bad-soft:#3B1E19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#151D1A; --surface-2:#1B2521; --ink:#E4EDE8; --muted:#92A29B; --line:#29352F;
  --accent:#4CC497; --accent-ink:#052419; --accent-soft:#173829;
  --want:#A98BF3; --want-soft:#272040;
  --warn:#E6A33C; --warn-soft:#382A12; --bad:#EF7A65; --bad-soft:#3B1E19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
.app{max-width:560px;margin:0 auto;padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{display:block}
.brand h1{font-size:1.3rem;font-weight:800}
.top-right{display:flex;align-items:center;gap:8px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:block}
.sync.ok i{background:var(--accent)} .sync.err i{background:var(--bad)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{stroke:var(--ink)}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:14px}

/* hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 18px 18px;box-shadow:var(--shadow)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
.chip.good{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.want{background:var(--want-soft);color:var(--want)}
.big{font-family:var(--display);font-weight:800;font-size:clamp(3rem,15vw,4.4rem);line-height:1;letter-spacing:-.03em;margin:12px 0 6px;font-variant-numeric:tabular-nums}
.big.bad{color:var(--bad)}
.meter{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:14px 0 8px;position:relative}
.meter > b{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s ease}
.meter.warn > b{background:var(--warn)} .meter.bad > b{background:var(--bad)}
.meter .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.hero-foot{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.over-note{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:14px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.want{background:var(--want-soft);color:var(--want);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn svg{stroke:currentColor}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.stat .v{font-family:var(--display);font-size:1.5rem;font-weight:800;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0;padding-top:2px}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d{font-size:12.5px;color:var(--muted)}
.row .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.dot.need{background:var(--accent)} .dot.want{background:var(--want)} .dot.goal{background:var(--warn)}
.del{background:none;border:0;color:var(--muted);font-size:12px;padding:6px;border-radius:8px}
.del.confirm{color:var(--bad);background:var(--bad-soft);font-weight:600}

.bar{height:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:6px;position:relative}
.bar > b{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.warn > b{background:var(--warn)} .bar.bad > b{background:var(--bad)} .bar.want > b{background:var(--want)}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.4}

.empty{text-align:center;padding:22px 10px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:1.05rem;margin-bottom:4px}

/* wait list */
.wcard{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.wcard.ready{border-color:var(--want);box-shadow:0 0 0 3px var(--want-soft)}
.wtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wname{font-weight:600;font-size:1.02rem;overflow-wrap:anywhere}
.wmeta{font-size:13px;color:var(--muted)}
.wbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wbtns .btn{min-height:44px;padding:10px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{background:none;border:0;border-radius:12px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.nav button svg{stroke:currentColor}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.nav .badge{position:absolute;top:3px;right:calc(50% - 20px);min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--want);color:var(--surface);font-size:10.5px;line-height:17px}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(8,14,11,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:92%;overflow:auto;position:relative;
  padding:0 max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .2s ease}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line)}
.sheet-bar{position:sticky;top:0;z-index:3;background:var(--surface);display:flex;align-items:center;justify-content:center;height:52px;margin-bottom:2px}
.sheet-x{position:absolute;right:-6px;top:8px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;padding:0}
.sheet-x svg{stroke:var(--ink)}
.sheet h2{font-size:1.35rem;margin-bottom:4px}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field > span{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px;min-height:46px}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea.input{min-height:110px;font-family:var(--mono);font-size:12px}
.amount-wrap{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:16px;padding:6px 14px}
.amount-wrap span{font-family:var(--display);font-size:2rem;font-weight:700;color:var(--muted)}
.amount-wrap input{border:0;background:transparent;font-family:var(--display);font-size:2.4rem;font-weight:800;width:100%;min-width:0;padding:4px 0;outline:none}
.amount-wrap:focus-within{outline:2px solid var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 10px;text-align:left}
.seg button b{display:block;font-size:15px}
.seg button small{color:var(--muted);font-size:12px}
.seg button[aria-pressed="true"].need{border-color:var(--accent);background:var(--accent-soft)}
.seg button[aria-pressed="true"].want{border-color:var(--want);background:var(--want-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.hint{border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px;background:var(--surface-2);border:1px solid var(--line)}
.hint.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.hint.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-btns{display:flex;flex-direction:column;gap:8px;margin-top:6px}

.pause-cost{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pause-cost .stat .v{font-size:1.35rem}
.qs{margin:0 0 16px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.qs li{padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:14.5px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

.split{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);margin:10px 0}
.split > b{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.chart-wrap{overflow-x:auto}
.chart text{fill:var(--muted);font-family:var(--body);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .b-ok{fill:var(--accent)} .chart .b-over{fill:var(--bad)} .chart .b-today{fill:var(--accent);opacity:.5}
.chart .allow{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3;opacity:.6}

.calc-line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14.5px}
.calc-line.total{border-top:1.5px solid var(--ink);margin-top:4px;padding-top:10px;font-weight:700}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-size:13.5px;flex-wrap:wrap}
.banner .link{color:var(--warn);text-decoration:underline}

/* onboarding */
.ob{padding-top:6px}
.ob h2{font-size:1.9rem;font-weight:800;line-height:1.1;margin-bottom:8px}
.ob p.lead{color:var(--muted);margin:0 0 18px;font-size:15.5px}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
.bill-edit{display:grid;grid-template-columns:1fr 100px 64px 34px;gap:6px;align-items:center;margin-bottom:8px}
.bill-edit .input{min-height:42px;padding:9px 10px}
.x{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.preview{border-radius:16px;background:var(--accent-soft);padding:14px 16px;margin:6px 0 16px}
.preview .v{font-family:var(--display);font-size:2rem;font-weight:800;color:var(--accent)}
@media (max-width:400px){.stats .stat .v{font-size:1.25rem}.bill-edit{grid-template-columns:1fr 84px 54px 34px}}
</style>
</head>
<body>


<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg></div>
      <h1>Steady</h1>
    </div>
    <div class="top-right">
      <span class="sync" id="sync"><i></i><span>Loading</span></span>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </header>
  <main id="view" class="stack"></main>
</div>
<nav class="nav" id="nav" hidden><div class="nav-in" id="navIn"></div></nav>

<script>
(function(){
"use strict";
const LS = "steady-budget-v1";
const DAY = 864e5;
const $ = s => document.querySelector(s);
let S = null;
let tab = "today";
let onbStep = 0;
const store = { doc:null, saving:false, pending:false, t:null };

/* ---------- helpers ---------- */
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sum = (a, f) => a.reduce((t, x) => t + (+f(x) || 0), 0);
const num = v => { let s = String(v).replace(/\s/g, ""); if (s.includes(",") && !s.includes(".")) s = s.replace(/,(\d{1,2})$/, ".$1"); const n = parseFloat(s.replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : 0; };
const LOC = () => (S && S.settings.currency === "ZAR") ? "en-ZA" : undefined;
const CURRENCIES = ["ZAR","USD","EUR","GBP","BWP","NAD","CAD","AUD","NZD","INR","SGD","JPY","CHF"];
const r2 = n => Math.round(n * 100) / 100;
function money(n, opts = {}){
  const whole = opts.whole ?? (Math.abs(n) >= 100 || Number.isInteger(r2(n)));
  try { return new Intl.NumberFormat(LOC(), {style:"currency", currency:S.settings.currency || "ZAR", minimumFractionDigits: whole?0:2, maximumFractionDigits: whole?0:2}).format(n); }
  catch { return "R" + n.toFixed(whole?0:2); }
}
function curSymbol(){
  try { return new Intl.NumberFormat(LOC(),{style:"currency",currency:S.settings.currency}).formatToParts(0).find(p=>p.type==="currency").value; } catch { return "R"; }
}
const sod = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const addDays = (t, n) => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n).getTime(); };
const daysBetween = (a, b) => Math.round((sod(b) - sod(a)) / DAY);
const fmtDay = t => {
  const today = sod(Date.now());
  if (sod(t) === today) return "Today";
  if (sod(t) === addDays(today, -1)) return "Yesterday";
  return new Date(t).toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
};
const fmtTime = t => new Date(t).toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
function hoursLeft(ms){
  if (ms <= 0) return "ready";
  const h = Math.floor(ms / 36e5), m = Math.ceil((ms % 36e5) / 6e4);
  if (h >= 24) return Math.floor(h/24) + "d " + (h%24) + "h left";
  if (h >= 1) return h + "h " + m + "m left";
  return m + "m left";
}
const workHours = amt => S.settings.hourly > 0 ? amt / S.settings.hourly : 0;
function workText(amt){
  const h = workHours(amt);
  if (!h) return "";
  if (h < 1) return Math.round(h * 60) + " minutes of work";
  return (h < 10 ? h.toFixed(1) : Math.round(h)) + " hours of work";
}

/* ---------- state ---------- */
const defaultCats = () => [["Groceries",3500],["Eating out",1000],["Transport",1500],["Fun",600],["Shopping",800],["Health",400],["Other",500]].map(([name,budget]) => ({id:uid(), name, budget}));
function defaultState(){
  return { v:1, setupDone:false, example:false, createdTs:Date.now(), updatedAt:0,
    zarSet:true, settings:{ currency:"ZAR", income:0, payday:25, hourly:0, savingsTarget:0, threshold:250, waitHours:48 },
    bills:[], categories:defaultCats(), tx:[], wait:[], goals:[], income:[], adjust:[], balances:null, payOverrides:{}, payTaps:{} };
}
function migrate(s){
  const d = defaultState();
  if (!s || typeof s !== "object") return d;
  const out = Object.assign(d, s, { settings:Object.assign(d.settings, s.settings || {}) });
  if (!s.zarSet){ out.settings.currency = "ZAR"; if (out.settings.threshold === 25) out.settings.threshold = 250; out.zarSet = true; }
  return out;
}
function loadLocal(){ try { const raw = localStorage.getItem(LS); return raw ? migrate(JSON.parse(raw)) : null; } catch { return null; } }
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch {} }

function commit(msg){
  S.updatedAt = Date.now();
  saveLocal();
  queueRemote();
  render();
  if (msg) toast(msg);
}
function queueRemote(){ if (!store.doc) return; /* no remote store in the standalone app */ clearTimeout(store.t); store.t = setTimeout(flush, 600); }
async function flush(){
  if (!store.doc) return;
  if (store.saving){ store.pending = true; return; }
  store.saving = true;
  try { await store.doc.set({ json: JSON.stringify(S), updatedAt: S.updatedAt }); setSync("ok"); }
  catch (e) { setSync("err"); }
  store.saving = false;
  if (store.pending){ store.pending = false; flush(); }
}
function setSync(kind){
  const el = $("#sync");
  el.className = "sync" + (kind === "ok" ? " ok" : kind === "err" ? " err" : "");
  el.querySelector("span").textContent = kind === "ok" ? "Saved" : kind === "err" ? "Not saved, retrying" : kind === "local" ? "On this phone" : "Loading";
  el.title = kind === "ok" ? "Saved to your account. Only you can see it." : kind === "local" ? "Your data is saved on this phone only. Make a backup now and then." : "";
  if (kind === "err") setTimeout(queueRemote, 4000);
}

async function connect(){
  setSync("local");
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch {}
}
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });

/* ---------- math ---------- */
// Pay periods run from payday to payday. If salary arrives early, the person taps "I got paid today"
// and that month's payday moves to the day they tapped it (stored in S.payOverrides, keyed by the scheduled month).
const paydayNum = () => Math.min(28, Math.max(1, (S.settings.payday | 0) || 1));
const payKey = (y, m) => { const dt = new Date(y, m, 1); return dt.getFullYear() + "-" + dt.getMonth(); };
function payDayFor(y, m){
  const o = (S.payOverrides || {})[payKey(y, m)];
  return o != null ? o : new Date(y, m, paydayNum()).getTime();
}
function periodFor(t){
  const now = new Date(t);
  let y = now.getFullYear(), m = now.getMonth();
  if (now.getDate() < paydayNum()) m -= 1;
  let start = payDayFor(y, m), end = payDayFor(y, m + 1);
  if (t >= end){ start = end; end = payDayFor(y, m + 2); }
  return { start, end };
}
const billsTotal = () => sum(S.bills, b => b.amount);
const inPeriod = (t, p) => t >= p.start && t < p.end;
// extra money in (minus the part set aside) and catch-up adjustments only count in their own pay period
const extraIn = p => sum((S.income || []).filter(x => inPeriod(x.ts, p)), x => x.amt - (x.saved || 0));
const adjustFor = p => sum((S.adjust || []).filter(x => inPeriod(x.ts, p)), x => x.amt);
const basePool = () => S.settings.income - billsTotal() - S.settings.savingsTarget;
const poolFor = p => basePool() + extraIn(p) - adjustFor(p);

function daySeries(p, upto){
  // allowance and spend for each day of period p, up to and including day `upto`
  const P = poolFor(p);
  const ptx = S.tx.filter(t => t.ts >= p.start && t.ts < p.end);
  const total = daysBetween(p.start, p.end);
  const out = []; let cum = 0;
  for (let i = 0; i < total; i++){
    const ds = addDays(p.start, i), de = addDays(p.start, i + 1);
    if (ds > upto) break;
    const s = sum(ptx.filter(t => t.ts >= ds && t.ts < de), t => t.amt);
    const allow = Math.max(0, (P - cum) / (total - i));
    out.push({ ds, s, allow });
    cum += s;
  }
  return out;
}

// Bank and savings: start from the last balances the person typed in, then apply what happened since:
// logged spending, money in, transfers to goals, salary on payday (minus the monthly savings) and bills on their due day.
function balances(){
  const b = S.balances; if (!b) return null;
  let bank = b.bank, sav = b.savings, changes = 0;
  S.tx.forEach(t => { if (t.ts > b.ts){ bank -= t.amt; if (t.kind === "goal") sav += t.amt; changes++; } });
  (S.income || []).forEach(x => { if (x.ts > b.ts){ bank += x.amt - (x.saved || 0); sav += (x.saved || 0); changes++; } });
  const today = sod(Date.now());
  for (let day = addDays(sod(b.ts), 1), n = 0; day <= today && n < 800; day = addDays(day, 1), n++){
    const dt = new Date(day), date = dt.getDate(), last = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
    // scheduled paydays only; early paydays are counted below from the moment "I got paid today" was tapped
    if ((S.payOverrides || {})[payKey(dt.getFullYear(), dt.getMonth())] == null && new Date(dt.getFullYear(), dt.getMonth(), paydayNum()).getTime() === day){ bank += S.settings.income - S.settings.savingsTarget; sav += S.settings.savingsTarget; changes++; }
    S.bills.forEach(bl => { if (Math.min(last, bl.day | 0 || 1) === date){ bank -= bl.amount; changes++; } });
  }
  Object.keys(S.payOverrides || {}).forEach(k => {
    const tap = (S.payTaps || {})[k] ?? S.payOverrides[k];
    if (tap > b.ts && tap <= Date.now()){ bank += S.settings.income - S.settings.savingsTarget; sav += S.settings.savingsTarget; changes++; }
  });
  return { bank:r2(bank), savings:r2(sav), ts:b.ts, changes };
}

function calc(){
  const now = Date.now(), today = sod(now), p = periodFor(now);
  const P = poolFor(p);
  const incomes = (S.income || []).filter(x => inPeriod(x.ts, p)).sort((a,b) => b.ts - a.ts);
  const extra = sum(incomes, x => x.amt), extraSaved = sum(incomes, x => x.saved || 0), adjust = adjustFor(p);
  const ptx = S.tx.filter(t => t.ts >= p.start && t.ts < p.end);
  const spent = sum(ptx, t => t.amt);
  const spentToday = sum(ptx.filter(t => t.ts >= today), t => t.amt);
  const before = spent - spentToday;
  const daysTotal = daysBetween(p.start, p.end);
  const daysLeft = Math.max(1, daysBetween(today, p.end));
  const allowance = Math.max(0, (P - before) / daysLeft);
  const safe = allowance - spentToday;
  const remaining = P - spent;
  const tomorrow = daysLeft > 1 ? Math.max(0, remaining / (daysLeft - 1)) : 0;
  const needs = sum(ptx.filter(t => t.kind === "need"), t => t.amt);
  const wants = sum(ptx.filter(t => t.kind === "want"), t => t.amt);
  const toGoals = sum(ptx.filter(t => t.kind === "goal"), t => t.amt);
  const byCat = {};
  ptx.forEach(t => { if (t.cat) byCat[t.cat] = (byCat[t.cat] || 0) + t.amt; });
  const series = daySeries(p, today);
  const created = sod(S.createdTs);

  // streak of days at or under allowance, walking back through earlier periods too
  let streak = 0, cursorP = p, guard = 0, stop = false;
  while (!stop && guard++ < 8){
    const ser = daySeries(cursorP, addDays(today, -1)).reverse();
    for (const d of ser){
      if (d.ds >= today) continue;
      if (d.ds < created){ stop = true; break; }
      if (d.s <= d.allow + 0.005) streak++; else { stop = true; break; }
    }
    if (cursorP.start <= created) break;
    cursorP = periodFor(addDays(cursorP.start, -1));
  }
  const noSpend = series.filter(d => d.ds < today && d.ds >= created && d.s === 0).length;
  const skipped = S.wait.filter(w => w.status === "skipped");
  const savedByWaiting = sum(skipped, w => w.amt);
  const elapsed = (daysTotal - daysLeft) / daysTotal;
  return { incomes, extra, extraSaved, adjust, p, P, ptx, spent, spentToday, allowance, safe, remaining, tomorrow, daysLeft, daysTotal, needs, wants, toGoals, byCat, series, streak, noSpend, savedByWaiting, skippedCount:skipped.length, elapsed, today };
}

function ago(t){
  const d = daysBetween(t, Date.now());
  return d <= 0 ? "today" : d === 1 ? "yesterday" : d + " days ago";

  const inGoals = sum(S.goals, g => Math.min(g.saved, g.target));

    </div>
    <p class="muted small" style="margin:10px 0 0">${b.changes ? `You updated these ${ago(b.ts)}. Since then Steady has added and taken off what you've logged, paydays and bills. If it doesn't match your bank app, tap Update.` : `Updated ${ago(b.ts)}.`}</p>
  </section>`;
}

function upcomingBills(n){
  const today = sod(Date.now()); const out = [];
  S.bills.forEach(b => {
    const day = Math.min(31, Math.max(1, b.day | 0 || 1));
    const now = new Date(today);
    let due = new Date(now.getFullYear(), now.getMonth(), day).getTime();
    if (due < today) due = new Date(now.getFullYear(), now.getMonth() + 1, day).getTime();
    const inDays = daysBetween(today, due);
    if (inDays <= n) out.push({ ...b, inDays });
  });
  return out.sort((a,b) => a.inDays - b.inDays);
}

function catName(id){ const c = S.categories.find(c => c.id === id); return c ? c.name : "Other"; }
function txRow(t){
  const goal = t.kind === "goal" ? (S.goals.find(g => g.id === t.goal) || {}).name || "a goal" : "";
  const title = t.kind === "goal" ? "Moved to " + esc(goal) : esc(t.note || catName(t.cat));
  const sub = t.kind === "goal" ? "Savings" : (t.note ? esc(catName(t.cat)) + " · " : "") + (t.kind === "want" ? "Want" : "Need");
  return `<div class="row"><span class="dot ${t.kind}"></span><div class="main"><div class="t">${title}</div><div class="d">${sub} · ${fmtTime(t.ts)}</div></div><div class="amt">${money(t.amt)}</div><button class="del" data-del-tx="${t.id}" aria-label="Delete">Delete</button></div>`;
}

function waitCard(w){

  return `<div class="wcard ${ready?"ready":""}">
    <div class="wtop"><div style="min-width:0"><div class="wname">${esc(w.name)}</div><div class="wmeta">${wt?wt+" · ":""}added ${fmtDay(w.addedTs).toLowerCase()}</div></div><div class="num" style="font-weight:700;font-size:1.1rem">${money(w.amt)}</div></div>

}

function chart14(){
  const today = sod(Date.now());
  const days = [];
  for (let i = 13; i >= 0; i--){
    const ds = addDays(today, -i);
    const ser = daySeries(periodFor(ds), ds);
    const d = ser.find(x => x.ds === ds) || { ds, s:0, allow:0 };
    days.push(ds < sod(S.createdTs) ? { ...d, pre:true } : d);
  }
  const W = 340, H = 170, L = 38, R = 6, T = 10, B = 24;
  const maxV = Math.max(10, ...days.map(d => Math.max(d.s, d.allow)));
  const step = niceStep(maxV / 3);
  const top = Math.ceil(maxV / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const bw = (W - L - R) / days.length;
  let g = "";
  for (let v = 0; v <= top + 0.001; v += step){
    g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end">${esc(money(v,{whole:true}))}</text>`;
  }
  let bars = "", pts = [];
  days.forEach((d, i) => {
    const x = L + i * bw;
    const h = y(0) - y(d.s);
    const cls = d.ds === today ? "b-today" : d.s > d.allow + 0.005 ? "b-over" : "b-ok";
    if (d.s > 0) bars += `<rect class="${cls}" x="${(x+bw*0.18).toFixed(1)}" y="${y(d.s).toFixed(1)}" width="${(bw*0.64).toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="2"/>`;
    if (!d.pre) pts.push(`${(x+bw/2).toFixed(1)},${y(d.allow).toFixed(1)}`);
    if (i % 2 === (days.length-1) % 2) bars += `<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${new Date(d.ds).getDate()}</text>`;
  });
  const line = pts.length > 1 ? `<polyline class="allow" points="${pts.join(" ")}"/>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily spending compared with daily allowance for the last 14 days">${g}${bars}${line}</svg>`;
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x))); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }

/* ---------- sheets ---------- */
let sheetCleanup = null, sheetHist = false, ignorePop = false;
// Each open pop-up adds one history entry, so the phone's back button/gesture closes it instead of leaving the app.
window.addEventListener("popstate", () => {
  if (ignorePop){ ignorePop = false; return; }
  if (sheetHist){ sheetHist = false; closeSheet(true); }
});
function openSheet(html, mount){
  closeSheet(true);
  if (!sheetHist){ try { history.pushState({ steadySheet:1 }, ""); sheetHist = true; } catch {} }
  const ov = document.createElement("div");
  ov.className = "overlay"; ov.id = "overlay";
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-bar"><div class="grab"></div><button class="sheet-x" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>${html}</div>`;
  ov.addEventListener("click", e => { if (e.target === ov || e.target.closest(".sheet-x")) closeSheet(); });
  document.body.appendChild(ov);
  const first = ov.querySelector("[autofocus]") || ov.querySelector(".sheet input, .sheet select, .sheet textarea");
  if (first) setTimeout(() => first.focus(), 30);
  sheetCleanup = mount ? mount(ov.querySelector(".sheet")) : null;
}
function closeSheet(keepHistory){
  const ov = $("#overlay"); if (ov) ov.remove();
  if (typeof sheetCleanup === "function") sheetCleanup(); sheetCleanup = null;
  if (!keepHistory && sheetHist){ sheetHist = false; ignorePop = true; try { history.back(); } catch { ignorePop = false; } }
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function toast(msg){
  const old = $(".toast"); if (old) old.remove();
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

function sheetPause(entry){
  const c = calc();
  const wt = workHours(entry.amt);
  const pctToday = c.allowance > 0 ? Math.round(entry.amt / c.allowance * 100) : 0;
  const goal = S.goals.find(g => g.saved < g.target);
  let secs = 8;
  openSheet(`
    <span class="chip want" style="margin-bottom:10px"><i></i>Pause</span>

    <div class="pause-cost">
      <div class="stat"><div class="label">${wt?"Your time":"Today"}</div><div class="v num">${wt ? (wt<1?Math.round(wt*60)+" min":(wt<10?wt.toFixed(1):Math.round(wt))+" hrs") : pctToday+"%"}</div><div class="s">${wt?"of work to pay for it":"of today's allowance"}</div></div>
      <div class="stat"><div class="label">${goal?"Or toward":"Today after"}</div><div class="v num">${goal ? Math.round(entry.amt/Math.max(1,goal.target)*100)+"%" : money(c.safe-entry.amt)}</div><div class="s">${goal?"of "+esc(goal.name):"safe to spend"}</div></div>
    </div>

    <div class="sheet-btns">

      <button class="btn primary block" id="p-skip">I don't need it</button>

    </div>
  `, sh => {
    const buy = sh.querySelector("#p-buy");
    const iv = setInterval(() => { secs--; if (secs <= 0){ clearInterval(iv); buy.disabled = false; buy.textContent = "Buy it anyway"; } else buy.textContent = `Buy it anyway (${secs})`; }, 1000);
    sh.querySelector("#p-wait").onclick = () => { addWait(entry.note || catName(entry.cat), entry.amt, S.settings.waitHours, entry.cat); closeSheet(); commit("On the wait list. Check back in " + waitLabel() + "."); };

    buy.onclick = () => { S.tx.push(entry); closeSheet(); commit("Logged " + money(entry.amt)); };
    return () => clearInterval(iv);
  });
}

function sheetIncome(){

  const g = id ? S.goals.find(x => x.id === id) : null;
  openSheet(`
    <h2>${g ? "Edit goal" : "New goal"}</h2><p class="sub">Name it after the thing, not the number. "Cape Town trip" beats "Savings".</p>
    <label class="field"><span>Goal</span><input class="input" id="g-name" value="${esc(g?.name||"")}" placeholder="e.g. Emergency fund" autofocus></label>
    <div class="two"><label class="field"><span>Target</span><input class="input num" id="g-target" inputmode="decimal" value="${g?g.target:""}" placeholder="0"></label>
    <label class="field"><span>Already saved</span><input class="input num" id="g-saved" inputmode="decimal" value="${g?g.saved:""}" placeholder="0"></label></div>
    <div class="sheet-btns"><button class="btn primary block" id="g-save">Save</button>${g ? `<button class="btn danger block" id="g-del">Delete goal</button>` : ""}</div>
  `, sh => {
    sh.querySelector("#g-save").onclick = () => {
      const name = sh.querySelector("#g-name").value.trim(), target = num(sh.querySelector("#g-target").value), saved = num(sh.querySelector("#g-saved").value);
      if (!name || !(target > 0)) return;
      if (g) Object.assign(g, { name, target, saved }); else S.goals.push({ id:uid(), name, target, saved });
      closeSheet(); commit("Saved");
    };
    const del = sh.querySelector("#g-del");
    if (del) del.onclick = () => {
      if (del.dataset.sure !== "1"){ del.dataset.sure = "1"; del.textContent = "Tap again to delete"; return; }
      S.goals = S.goals.filter(x => x.id !== g.id); closeSheet(); commit("Goal deleted");
    };
  });
}

function sheetFund(id){
  const g = S.goals.find(x => x.id === id); if (!g) return;
  const sym = esc(curSymbol());
  openSheet(`
    <h2>Add to ${esc(g.name)}</h2><p class="sub">Where is the money coming from?</p>
    <div class="field"><div class="amount-wrap"><span>${sym}</span><input id="f-amt" inputmode="decimal" placeholder="0" autofocus aria-label="Amount"></div></div>
    <div class="sheet-btns">
      <button class="btn primary block" id="f-sav">From my monthly savings</button>
      <button class="btn block" id="f-spend">From this period's spending money</button>
    </div>
    <p class="muted small" style="margin-top:10px">Spending money moved to a goal lowers your daily allowance, so you can't accidentally spend it.</p>
  `, sh => {
    const amt = () => r2(num(sh.querySelector("#f-amt").value));
    sh.querySelector("#f-sav").onclick = () => { const a = amt(); if (!(a > 0)) return; g.saved = r2(g.saved + a); closeSheet(); commit(money(a) + " added to " + g.name); };
    sh.querySelector("#f-spend").onclick = () => { const a = amt(); if (!(a > 0)) return; g.saved = r2(g.saved + a); S.tx.push({ id:uid(), amt:a, cat:null, kind:"goal", goal:g.id, note:"", ts:Date.now() }); closeSheet(); commit(money(a) + " moved to " + g.name); };
  });
}

function sheetSettings(){
  const st = S.settings;
  openSheet(`
    <h2>Settings</h2><p class="sub">Change these whenever your situation changes. Your daily number updates right away.</p>
    <div class="two">
      <label class="field"><span>Monthly take-home pay</span><input class="input num" id="s-income" inputmode="decimal" value="${st.income}"></label>
      <label class="field"><span>Payday (1–28)</span><input class="input num" id="s-payday" inputmode="numeric" value="${st.payday}"></label>
      <label class="field"><span>Save each month</span><input class="input num" id="s-save" inputmode="decimal" value="${st.savingsTarget}"></label>
      <label class="field"><span>Hourly pay</span><input class="input num" id="s-hourly" inputmode="decimal" value="${st.hourly||""}" placeholder="optional"></label>
      <label class="field"><span>Pause wants over</span><input class="input num" id="s-thr" inputmode="decimal" value="${st.threshold}"></label>
      <label class="field"><span>Default wait</span><select class="input" id="s-wait">${[[24,"1 day"],[48,"2 days"],[72,"3 days"],[168,"1 week"]].map(([h,l]) => `<option value="${h}" ${h===st.waitHours?"selected":""}>${l}</option>`).join("")}</select></label>
      <label class="field"><span>Currency</span><select class="input" id="s-cur">${CURRENCIES.map(c=>`<option ${c===st.currency?"selected":""}>${c}</option>`).join("")}</select></label>
    </div>
    <button class="btn primary block" id="s-save-btn">Save settings</button>
    <hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
    <h3 style="font-size:1rem;margin-bottom:6px">Backup</h3>
    <p class="muted small" style="margin:0 0 10px">Your data lives only on this phone. Save a backup now and then (email it to yourself or keep it in your files), so you never lose it.</p>
    <div class="two"><button class="btn" id="s-file">Save backup file</button><button class="btn" id="s-copy">Copy backup</button></div>
    <button class="btn ghost block" id="s-restore-open" style="margin-top:8px">Restore from a backup</button>
    <div id="s-restore" hidden style="margin-top:10px"><label class="btn block" style="margin-bottom:8px">Choose a backup file<input type="file" id="s-pick" accept=".json,application/json" hidden></label><textarea class="input" id="s-paste" placeholder="…or paste your backup text here"></textarea><button class="btn primary block" id="s-restore-go" style="margin-top:8px">Replace my data with this backup</button></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
    <button class="btn danger block" id="s-reset">Erase everything and start over</button>
  `, sh => {
    sh.querySelector("#s-save-btn").onclick = () => {
      st.income = num(sh.querySelector("#s-income").value);
      st.payday = Math.min(28, Math.max(1, num(sh.querySelector("#s-payday").value) || 1));
      st.savingsTarget = num(sh.querySelector("#s-save").value);
      st.hourly = num(sh.querySelector("#s-hourly").value);
      st.threshold = num(sh.querySelector("#s-thr").value);
      st.waitHours = +sh.querySelector("#s-wait").value;
      st.currency = sh.querySelector("#s-cur").value;
      closeSheet(); commit("Settings saved");
    };
    sh.querySelector("#s-copy").onclick = async (e) => {
      const txt = JSON.stringify(S);
      try { await navigator.clipboard.writeText(txt); toast("Backup copied"); }
      catch { const r = sh.querySelector("#s-restore"); r.hidden = false; const ta = sh.querySelector("#s-paste"); ta.value = txt; ta.select(); toast("Select all and copy the text below"); }
    };
    sh.querySelector("#s-file").onclick = async () => {
      const name = "steady-backup-" + new Date().toISOString().slice(0,10) + ".json";
      const blob = new Blob([JSON.stringify(S)], { type:"application/json" });
      try {
        const file = new File([blob], name, { type:"application/json" });
        if (navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:"Steady backup" }); return; }
      } catch (e) { if (e && e.name === "AbortError") return; }
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast("Backup saved");
    };
    sh.querySelector("#s-restore-open").onclick = () => { sh.querySelector("#s-restore").hidden = false; sh.querySelector("#s-paste").focus(); };
    sh.querySelector("#s-pick").onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { sh.querySelector("#s-paste").value = r.result; toast("Backup loaded. Tap Replace to restore it."); }; r.readAsText(f); };
    sh.querySelector("#s-restore-go").onclick = () => {
      try { const d = JSON.parse(sh.querySelector("#s-paste").value); if (!d || !d.settings) throw 0; S = migrate(d); closeSheet(); commit("Backup restored"); }
      catch { toast("That doesn't look like a Steady backup. Paste the whole text."); }
    };
    const reset = sh.querySelector("#s-reset");
    reset.onclick = () => {
      if (reset.dataset.sure !== "1"){ reset.dataset.sure = "1"; reset.textContent = "Tap again to erase all data"; return; }
      const cur = S.settings.currency; S = defaultState(); S.settings.currency = cur; draft = null; onbStep = 0; closeSheet(); commit("Everything erased");
    };
  });
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  if (e.target.closest("#overlay")) return;
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (t.id === "settingsBtn") return sheetSettings();
  if (d.tab){ tab = d.tab; render(); window.scrollTo(0,0); return; }
  if (d.ob){
    readOnb();
    if (d.ob === "next"){
      if (onbStep === 0 && !(num(draft.income) > 0)){ const el = $("#ob-income"); el.focus(); toast("Enter your monthly take-home pay"); return; }
      onbStep++; render(); return;
    }
    if (d.ob === "back"){ onbStep--; render(); return; }
    if (d.ob === "add-bill"){ draft.bills.push({ id:uid(), name:"", amount:"", day:1 }); render(); const last = draft.bills[draft.bills.length-1]; document.getElementById("bn-"+last.id)?.focus(); return; }
    if (d.ob === "finish") return finishOnb();
    if (d.ob === "example") return loadExample();
  }
  if (d.obRm){ draft.bills = draft.bills.filter(b => b.id !== d.obRm); render(); return; }
  if (d.act === "add") return sheetAdd();
  if (d.act === "want") return sheetWant();
  if (d.act === "catchup") return sheetCatchup();
  if (d.act === "balances") return sheetBalances();
  if (d.act === "paid-today"){
    if (!S.payOverrides) S.payOverrides = {};
    S.payOverrides[d.key] = sod(Date.now());
    if (!S.payTaps) S.payTaps = {};
    S.payTaps[d.key] = Date.now();
    commit("New month started. Here's your fresh daily number."); window.scrollTo(0,0); return;
  }
  if (d.act === "undo-paid"){
    if (S.payOverrides) delete S.payOverrides[d.key];
    if (S.payTaps) delete S.payTaps[d.key];
    commit("Undone. Back to waiting for payday."); return;
  }
  if (d.act === "income") return sheetIncome();
  if (d.delInc){
    if (!t.classList.contains("confirm")){ t.classList.add("confirm"); t.textContent = "Sure?"; setTimeout(() => { if (t.isConnected){ t.classList.remove("confirm"); t.textContent = "Delete"; } }, 3000); return; }
    const x = (S.income || []).find(i => i.id === d.delInc);
    if (x && x.goal && x.saved){ const g = S.goals.find(g => g.id === x.goal); if (g) g.saved = r2(Math.max(0, g.saved - x.saved)); }
    S.income = S.income.filter(i => i.id !== d.delInc); commit("Deleted"); return;
  }
  if (d.act === "settings") return sheetSettings();
  if (d.act === "add-cat") return sheetCat();
  if (d.act === "add-bill") return sheetBill();
  if (d.act === "add-goal") return sheetGoal();
  if (d.act === "start-fresh"){ const cur = S.settings.currency; S = defaultState(); S.settings.currency = cur; draft = null; onbStep = 0; commit(); return; }
  if (d.editCat) return sheetCat(d.editCat);
  if (d.editBill) return sheetBill(d.editBill);
  if (d.editGoal) return sheetGoal(d.editGoal);
  if (d.fund) return sheetFund(d.fund);
  if (d.buy) return sheetBuy(d.buy);
  if (d.skip) return sheetSkip(d.skip);
  if (d.delTx){
    if (!t.classList.contains("confirm")){ t.classList.add("confirm"); t.textContent = "Sure?"; setTimeout(() => { if (t.isConnected){ t.classList.remove("confirm"); t.textContent = "Delete"; } }, 3000); return; }
    const tx = S.tx.find(x => x.id === d.delTx);
    if (tx && tx.kind === "goal"){ const g = S.goals.find(x => x.id === tx.goal); if (g) g.saved = r2(Math.max(0, g.saved - tx.amt)); }
    S.tx = S.tx.filter(x => x.id !== d.delTx); commit("Deleted");
  }
});

/* ---------- boot ---------- */
S = loadLocal() || defaultState();
render();
setInterval(() => { if (!$("#overlay") && S.setupDone && document.visibilityState === "visible") render(); }, 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !$("#overlay")) render(); });
connect();
})();
</script>

</body>
</html>
